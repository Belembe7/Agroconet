services:
  postgres:
    image: postgres:16-alpine
    container_name: agroconet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agroconet
      POSTGRES_PASSWORD: agroconet_dev
      POSTGRES_DB: agroconet
    volumes:
      - agroconet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroconet -d agroconet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agroconet_pgdata:
